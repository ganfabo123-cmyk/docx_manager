[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hit-paper-helper"
version = "0.1.0"
description = "HIT Paper Helper - DOCX processing tools"
requires-python = ">=3.8"
dependencies = [
    "pywin32",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["docx_manager*", "full_style_docx_fixer*"]
